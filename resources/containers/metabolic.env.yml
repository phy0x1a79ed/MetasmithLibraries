# Unified tool-environment resource: conda env spec + container pointer.
# Under the MAMBA runtime the conda env name is used (`mamba run -n
# fabfos-metabolic`); under Docker/Apptainer the container URI is used.
# The metabolic graph transforms are pure-python (networkx/pandas/pyarrow);
# the conda spec is authoritative for the default mamba runtime.
conda:
  name: fabfos-metabolic
  channels:
    - conda-forge
    - bioconda
  dependencies:
    - python=3.12
    - networkx
    - pandas
    - pyarrow
    - numpy
    - scipy
    - biopython
# NOTE: for Docker/Apptainer runs this image must also carry networkx+pyarrow;
# the data-science base is a starting point pending a purpose-built image.
container: docker://quay.io/biocontainers/networkx:3.1
