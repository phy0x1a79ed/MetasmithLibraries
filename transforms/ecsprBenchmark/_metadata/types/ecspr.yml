ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  ablation_importance:
    properties:
      Format: TSV
      _:
      - per-(fosmid, axis, orf) gene-ablation importance -- full/LOO/gene-solo for
        BOTH delta_reff and delta_ieff
      ext: tsv
      fields:
      - axis_id
      - delta_ieff_full
      - delta_ieff_loo
      - delta_ieff_solo
      - delta_reff_full
      - delta_reff_loo
      - delta_reff_solo
      - element
      - fosmid
      - importance
      - importance_ieff
      - n_rxn_orf
      - orf
      - r_base
      - sink_hub
      - source_hub
  addition_weights:
    properties:
      Format: pickle
      _:
      - per-fosmid addition map pickle (contig -> mnxr -> E) derived from the evidence
        weights; the reactions injected onto the host base graph
      ext: pkl
  atom_pairs:
    properties:
      Format: PARQUET
      _:
      - atom-atom mapping table, MNXR-keyed (substrate/product atom transits)
      ext: parquet
  base_graphs:
    properties:
    - DIRECTORY of per-element host (epi300) base reaction-network graphs (base_{C,N,S,P}.pkl)
      plus axes_testable.json (per-element list of solvable axis ids); the SMW base
  benchmark_answer_key:
    properties:
      _:
      - the frozen Y of the benchmark contract -- conditions/panel_anchors/panel_edges/expectations.
        Authored WITHOUT reading any ECSPr output, which is the property that makes
        a score a measurement rather than a tuning; frozen and hashed before any solve
        runs
      content: directory of conditions/panel_anchors/panel_edges/expectations TSVs
        + provenance JSON
  benchmark_base_graphs:
    properties:
      _:
      - the element-resolved bipartite graphs the incumbent solves on, one per (facet,
        element). NOT derivable from X -- X withholds the atom mapping on purpose,
        and the atom-transit count is both the edge weight and, via the w<=0 edge
        drop, the connectivity. Network construction, never ECSPr output, which is
        what lets the answer-key builders read it without breaking independence
      content: directory of netA_*/netB_*/base_{C,N,S,P}.pkl networkx graphs
  benchmark_baseline:
    properties:
      _:
      - reference SCORES from a previously scored run, carried so a new result has
        something to be compared against. An output of scoring, never an input to
        it -- staging this where the answer key belongs would leak scored numbers
        into the key
      content: directory of specificity/potency/essentiality TSVs
  benchmark_decisions:
    properties:
      _:
      - the hand-made curation decision tables (strain->lineage->GEM, and gene->reaction
        overrides with deciding evidence). Committed as DATA rather than buried as
        literals in a builder, so each judgement call is reviewable
      content: directory of host_lineage.tsv + gene_reaction_overrides.tsv
  benchmark_ground_truth:
    properties:
      _:
      - the upstream ground-truth tables the answer key is DERIVED FROM (phenotype/auxotrophy
        edges, LOF essentiality, curated GOF transplant sinks). Staged so a version
        can rebuild its own answer key from source rather than inheriting another
        version's conclusions
      content: directory of conditions_manifest + pheno_edges + lof_ground_truth +
        gof_*.tsv
  benchmark_inputs:
    properties:
      _:
      - the frozen X of the benchmark contract -- hosts/gpr/reactions/reaction_participants/metabolites/crosswalk/invariants.
        Carries the per-reaction evidence weight E for every build, which is exactly
        why the benchmark needs no annotation lane re-run. Ships NO atom mapping,
        deliberately
      content: directory of the seven X TSVs + _provenance.json
  benchmark_observations:
    properties:
      _:
      - MEASURED perturbation outcomes (the observation set, X-side evidence); one
        row per observed gene-set/host/target with the reactions it adds or removes.
        Never an expectation and never scored output -- this is what was seen in a
        wet lab, before any ECSPr number exists
      content: directory of gof_/lof_ observation TSVs + drops/audit tables + README
  benchmark_observations_solved:
    properties:
      _:
      - SOLVER OUTPUT, one shard table per (facet, element) -- the signed conductance
        change g_perturbed - g_base on every panel edge, for every condition in the
        answer key. Emphatically NOT ecspr::benchmark_observations, which is the measured
        wet-lab evidence authored before any solve ran; this is what the incumbent
        PREDICTS for those conditions and exists only after a solve. Sharded, unsorted,
        and not yet scorable -- the scorer reads the merged ecspr::benchmark_result,
        never this
      content: directory of <facet>/<element>.tsv, cols facet/condition_id/edge_id/effect
  benchmark_provenance:
    properties:
      _:
      - a benchmark version's own self-description -- per-file sha256 manifest, audit
        gate results, and the prose recording what it is and what it deliberately
        does not contain
      content: directory of MANIFEST.tsv + _audit.json + README.md + PROVENANCE.md
  benchmark_result:
    properties:
      Format: TSV
      _:
      - the single merged benchmark observation table -- every (facet, element) shard
        concatenated and sorted on (facet, condition_id, edge_id). THE scorable artifact
        of a benchmark run and the only one a scoring step should read; a per-shard
        table is a fragment of a measurement, not a measurement. Effects are signed
        differences, zero where a perturbation was silent (a zero is a result, never
        a missing value), and the scorer consumes ORDER only
      ext: tsv
      fields:
      - condition_id
      - edge_id
      - effect
      - facet
  benchmark_universe:
    properties:
      _:
      - the atom-mapped MetaNetX universe per element, from which every base graph
        is induced. Needed at SOLVE time and not only at build time -- applying a
        gain-of-function perturbation re-reads it to find the inserted reactions,
        so a tree without it fails on the first GOF condition
      content: directory of mnx_bipartite_{C,N,S,P}.pkl
  biomass_axes:
    properties:
      Format: JSON
      _:
      - biomass source->sink axes as JSON; each axis id (..__src__snk__X) maps to
        source/sink metabolite hubs. The axis SET is an experiment's choice, not the
        engine's -- the caller stages the set it means and asserts its count; do not
        infer the set from the filename, which is what drifted.
      ext: json
  closure_ledger:
    properties:
      Format: PARQUET
      _:
      - per-reaction closure ledger (resolved / diluted / refused + reason)
      ext: parquet
  compute_profile:
    properties:
      Format: YAML
      _:
      - 'compute profile for the solve/ablation: `device:` (cpu|cuda) and `dtype:`
        (float64|float32), one per line. A STAGED, CONTENT-HASHED INPUT so it enters
        the task hash -- a GPU run and a CPU run of the same step MUST produce different
        cache keys. NEVER carry these via context.params: params are populated only
        from the runtime resources line (cpus/memory/attempt), so a params-borne knob
        is silently always its default AND collides on one cache entry.'
      ext: yml
  curated_gem:
    properties:
      Format: JSON
      _:
      - curated genome-scale metabolic model (COBRA JSON; iML1515 / iECDH10B) for
        the direct-GEM Network A base -- crosswalked to current MNXR and induced on
        the atom-mapped universe with uniform E=1.0
      ext: json
  direction_ratios:
    properties:
      Format: parquet
      _:
      - 'per-reaction DIRECTIONALITY ratios for the directed (diode) solve: a parquet
        (cols mnxr, ratio) giving MNXR -> g_rev/g_fwd = exp(dG''/RT) from the fused
        direction ensemble. Passed to `ecspr_network.py solve-directed --direction`.
        ratio==1.0 is reversible (parity with the undirected model); every reaction
        is present. Network-AGNOSTIC (a static function of the MNXR ids), so it is
        a shared staged input, never per-experiment.'
      ext: parquet
  evidence_weights:
    properties:
      Format: parquet
      _:
      - per-(source,orf,mnxr) belief-conservation evidence weights (E_full/E_dlec/n_orf)
        from nomination allocation; = reaction_redundancy, consumed by base-graphs
        + catalog
      ext: parquet
  frozen_null:
    properties:
    - DIRECTORY of null draws for BOTH lanes, one {lane}_null_canonical_N{n}.tsv per
      draw size; the scorer DERIVES its draw sizes from this directory's contents,
      so it must be a CURATED dir built from an explicit list by the caller -- never
      a raw cache, which accumulates retired sizes beside the canonical ones
  ieff_axes_report:
    properties:
      Format: TSV
      _:
      - per-(fosmid, element, axis) observed effective-conductance delta_ieff solve
        report (1/r_aug - 1/r_base)
      ext: tsv
      fields:
      - axis_id
      - delta_ieff
      - element
      - fosmid
      - g_aug
      - g_base
      - iter
      - n_added_rxns
      - sink_hub
      - source_hub
      - null
  ieff_significance:
    properties:
      Format: TSV
      _:
      - effective-conductance significance vs the staged null (full-mixture SF p +
        per-row empirical p_emp, SF-interpolated across flanking size anchors, BH-q
        within element x style for schema parity only -- rank by effect size)
      ext: tsv
      fields:
      - N_hi
      - N_lo
      - at_floor
      - axis_id
      - delta_obs
      - element
      - fosmid
      - k_hi
      - k_lo
      - n_bg
      - n_orfs
      - p
      - p_emp
      - p_floor
      - q
      - survives
      - w
      - null
  ieff_significance_study:
    properties:
      Format: TSV
      _:
      - effective-conductance significance under an ALTERNATIVE null-scoring family
        (study only; not canonical -- see ecspr::ieff_significance)
      ext: tsv
      fields:
      - N_hi
      - N_lo
      - at_floor
      - axis_id
      - delta_obs
      - element
      - family
      - fosmid
      - n_bg
      - n_orfs
      - p
      - p_floor
      - q
      - w
      - null
  metanetx_chem_prop:
    properties:
      Format: TSV
      _:
      - MetaNetX chemical/metabolite properties table (chem_prop.tsv; element formulas
        per metabolite)
      ext: tsv
  metanetx_reac_prop:
    properties:
      Format: TSV
      _:
      - MetaNetX reaction properties table (reac_prop.tsv;
      ext: tsv
  metanetx_reac_xref:
    properties:
      Format: TSV
      _:
      - MetaNetX reaction cross-reference table (reac_xref.tsv; bigg.reaction / kegg.reaction
        xrefs -> current MNXR) for the direct-GEM crosswalk
      ext: tsv
  mnx_bipartite:
    properties:
    - DIRECTORY of per-element metabolite<->reaction bipartite graphs (mnx_bipartite_{C,N,S,P}.pkl)
      with element atom-count edge weights w_X; reused for addition-map construction
      and base-graph building
  null_model_spec:
    properties:
      Format: YAML
      _:
      - 'which null-SCORING family a STUDY run applies: `family:` (see resources/lib/ecspr_null_study.py
        FAMILIES). A STAGED, CONTENT-HASHED input, so two families produce different
        cache keys and cannot overwrite one another. Null GENERATION (style/K/N/seed)
        and null SCORING (how a p comes off the draws) are orthogonal; this is the
        scoring half. Adding a family is one entry in FAMILIES -- the transform, the
        canonical scorer and the DAG shape are untouched.'
      ext: yml
  reaction_catalog:
    properties:
    - DIRECTORY holding the five reaction-catalog parquets (reactions, metabolites,
      rxn_edges, orf_reactions, reaction_redundancy) synthesized from MetaNetX + the
      evidence table
  reaction_roles:
    properties:
      Format: TSV
      _:
      - 'reaction ROLES source for the directed (diode) solve: a MetaNetX reac_prop.tsv
        parsed to MNXR -> (substrate set, product set), which orients each base-graph
        reaction. Passed to `ecspr_network.py solve-directed --roles`. Network-AGNOSTIC
        (a static function of the MNXR ids), so it is a shared staged input, never
        per-experiment. Content-identical to metanetx_reac_prop but named for its
        role in the directed solve, matching the solve-directed CLI contract.'
      ext: tsv
  reference_manifest:
    properties:
      Format: JSON
      _:
      - pre-bake MANIFEST.json -- pins, content hashes, verdict counts
      ext: json
  reff_axes_report:
    properties:
      Format: TSV
      _:
      - per-(fosmid, element, axis) observed effective-resistance delta_reff solve
        report
      ext: tsv
      fields:
      - axis_id
      - delta_reff
      - element
      - fosmid
      - iter
      - n_added_rxns
      - r_aug
      - r_base
      - sink_hub
      - source_hub
      - null
  reff_significance:
    properties:
      Format: TSV
      _:
      - effective-resistance significance vs the staged null (full-mixture SF p +
        per-row empirical p_emp, SF-interpolated across flanking size anchors, BH-q
        within element x style for schema parity only -- rank by effect size)
      ext: tsv
      fields:
      - N_hi
      - N_lo
      - at_floor
      - axis_id
      - delta_obs
      - element
      - fosmid
      - k_hi
      - k_lo
      - n_bg
      - n_orfs
      - p
      - p_emp
      - p_floor
      - q
      - survives
      - w
      - null
  reff_significance_study:
    properties:
      Format: TSV
      _:
      - effective-resistance significance under an ALTERNATIVE null-scoring family
        (study only; not canonical -- see ecspr::reff_significance)
      ext: tsv
      fields:
      - N_hi
      - N_lo
      - at_floor
      - axis_id
      - delta_obs
      - element
      - family
      - fosmid
      - n_bg
      - n_orfs
      - p
      - p_floor
      - q
      - w
      - null
  significance_table:
    properties:
      Format: TSV
      _:
      - full-mixture-SF significance scorer output, one row per axis/clone cell
      ext: tsv
  validation_set:
    properties:
      _:
      - frozen expected outputs for the dual-network validation; gates only
      content: directory with MANIFEST.tsv + netA/ netB/ lanes/ ground_truth/
  worklist:
    properties:
      Format: TSV
      _:
      - pre-bake worklist of reactions pending resolution
      ext: tsv
