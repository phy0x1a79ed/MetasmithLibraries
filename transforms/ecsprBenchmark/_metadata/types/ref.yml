ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  antismash:
    properties:
    - for antiSMASH
  biocyc_flatfiles:
    properties:
      _:
      - BioCyc/MetaCyc flatfile distribution. LICENSED -- requires a BioCyc subscription
        and MUST NOT be redistributed in any shared bundle.
      content: directory
  biocyc_pgdb:
    properties:
    - Pathway Tools binary PGDB. LICENSED -- subscription only, never redistributed.
  diamond_db:
    properties:
      _:
      - 'a DIAMOND-formatted protein database. DERIVED, not external: the on-disk
        format is coupled to the DIAMOND binary that wrote it, so a major version
        bump invalidates the file even though its input FASTA is unchanged.'
      ext: dmnd
  genomad:
    properties:
    - for geNomad
  genome_bundle:
    properties:
      _:
      - a reference genome with its annotations (NCBI datasets layout)
      content: directory
  kegg_snapshot:
    properties:
    - cached KEGG REST responses. LICENSED -- bulk KEGG access requires a paid academic
      FTP subscription.
  kofam_release:
    properties:
    - a KOfam release component (ko_list, or the HMM profiles tarball)
  metanetx_chem_xref:
    properties:
      Format: TSV
      _:
      - MetaNetX metabolite cross-reference table
      ext: tsv
  model_weights_archive:
    properties:
    - neural network weights shipped as a loose archive. Contrast weights baked into
      a container image, which share that image's tier and inherit its availability.
  nucleotide_fasta:
    properties:
      Format: FASTA
      _:
      - nucleotide FASTA
      ext: fna
  protein_fasta_gz:
    properties:
      Format: FASTA
      _:
      - gzipped protein FASTA (an upstream sequence release)
      ext: fasta.gz
  reference_database:
    properties:
    - reference database
