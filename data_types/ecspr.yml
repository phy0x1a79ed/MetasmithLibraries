types:
# =====================================================================
# ECSPr (Effective Conductance with Stoichiometry-aware PRoblem)
# element-resolved metabolic-reaction-network solve + ablation + significance
# over the fosmid inserts. Numeric core: resources/lib/ecspr_*.py.
# Multi-element artifacts (base graphs, bipartite graphs, catalog) are
# DIRECTORIES, matching the lib CLIs' --base-dir/--bipartite-dir/--out dirs.
# =====================================================================

# ---- reused REFERENCE artifacts (staged inputs; never recomputed) ----
  metanetx_reac_prop:
    properties:
      _: MetaNetX reaction properties table (reac_prop.tsv; #-commented header, cols mnx_id/equation/reference/classifs/is_balanced/is_transport)
      Format: TSV
      ext: tsv
  metanetx_chem_prop:
    properties:
      _: MetaNetX chemical/metabolite properties table (chem_prop.tsv; element formulas per metabolite)
      Format: TSV
      ext: tsv
  mnx_bipartite:
    properties:
      _: DIRECTORY of per-element metabolite<->reaction bipartite graphs (mnx_bipartite_{C,N,S,P}.pkl) with element atom-count edge weights w_X; reused for addition-map construction and base-graph building
  biomass_axes:
    properties:
      _: biomass source->sink axes as JSON; each axis id (..__src__snk__X) maps to source/sink metabolite hubs. The axis SET is an experiment's choice, not the engine's -- the caller stages the set it means and asserts its count; do not infer the set from the filename, which is what drifted.
      Format: JSON
      ext: json
  curated_gem:
    properties:
      _: curated genome-scale metabolic model (COBRA JSON; iML1515 / iECDH10B) for the direct-GEM Network A base -- crosswalked to current MNXR and induced on the atom-mapped universe with uniform E=1.0
      Format: JSON
      ext: json
  metanetx_reac_xref:
    properties:
      _: MetaNetX reaction cross-reference table (reac_xref.tsv; bigg.reaction / kegg.reaction xrefs -> current MNXR) for the direct-GEM crosswalk
      Format: TSV
      ext: tsv
  frozen_null:
    properties:
      _: DIRECTORY of null draws for BOTH lanes, one {lane}_null_canonical_N{n}.tsv per draw size; the scorer DERIVES its draw sizes from this directory's contents, so it must be a CURATED dir built from an explicit list by the caller -- never a raw cache, which accumulates retired sizes beside the canonical ones
  null_model_spec:
    properties:
      _: "which null-SCORING family a STUDY run applies: `family:` (see resources/lib/ecspr_null_study.py FAMILIES). A STAGED, CONTENT-HASHED input, so two families produce different cache keys and cannot overwrite one another. Null GENERATION (style/K/N/seed) and null SCORING (how a p comes off the draws) are orthogonal; this is the scoring half. Adding a family is one entry in FAMILIES -- the transform, the canonical scorer and the DAG shape are untouched."
      Format: YAML
      ext: yml
  compute_profile:
    properties:
      _: "compute profile for the solve/ablation: `device:` (cpu|cuda) and `dtype:` (float64|float32), one per line. A STAGED, CONTENT-HASHED INPUT so it enters the task hash -- a GPU run and a CPU run of the same step MUST produce different cache keys. NEVER carry these via context.params: params are populated only from the runtime resources line (cpus/memory/attempt), so a params-borne knob is silently always its default AND collides on one cache entry."
      Format: YAML
      ext: yml
  reaction_roles:
    properties:
      _: "reaction ROLES source for the directed (diode) solve: a MetaNetX reac_prop.tsv parsed to MNXR -> (substrate set, product set), which orients each base-graph reaction. Passed to `ecspr_network.py solve-directed --roles`. Network-AGNOSTIC (a static function of the MNXR ids), so it is a shared staged input, never per-experiment. Content-identical to metanetx_reac_prop but named for its role in the directed solve, matching the solve-directed CLI contract."
      Format: TSV
      ext: tsv
  direction_ratios:
    properties:
      _: "per-reaction DIRECTIONALITY ratios for the directed (diode) solve: a parquet (cols mnxr, ratio) giving MNXR -> g_rev/g_fwd = exp(dG'/RT) from the fused direction ensemble. Passed to `ecspr_network.py solve-directed --direction`. ratio==1.0 is reversible (parity with the undirected model); every reaction is present. Network-AGNOSTIC (a static function of the MNXR ids), so it is a shared staged input, never per-experiment."
      Format: parquet
      ext: parquet

# ---- evidence weights + reaction catalog (produced) ----
  evidence_weights:
    properties:
      _: per-(source,orf,mnxr) belief-conservation evidence weights (E_full/E_dlec/n_orf) from nomination allocation; = reaction_redundancy, consumed by base-graphs + catalog
      Format: parquet
      ext: parquet
  reaction_catalog:
    properties:
      _: DIRECTORY holding the five reaction-catalog parquets (reactions, metabolites, rxn_edges, orf_reactions, reaction_redundancy) synthesized from MetaNetX + the evidence table

# ---- addition weights (per-fosmid element evidence maps) ----
  addition_weights:
    properties:
      _: "per-fosmid addition map pickle (contig -> mnxr -> E) derived from the evidence weights; the reactions injected onto the host base graph"
      Format: pickle
      ext: pkl

# ---- host base graphs (produced by base-graphs; consumed by solve/ablation) ----
  base_graphs:
    properties:
      _: DIRECTORY of per-element host (epi300) base reaction-network graphs (base_{C,N,S,P}.pkl) plus axes_testable.json (per-element list of solvable axis ids); the SMW base

# ---- ECSPr solve outputs (produced) ----
  reff_axes_report:
    properties:
      _: per-(fosmid, element, axis) observed effective-resistance delta_reff solve report
      Format: TSV
      fields:
      - element
      - axis_id
      - source_hub
      - sink_hub
      - fosmid
      - null
      - iter
      - delta_reff
      - r_base
      - r_aug
      - n_added_rxns
      ext: tsv
  ieff_axes_report:
    properties:
      _: per-(fosmid, element, axis) observed effective-conductance delta_ieff solve report (1/r_aug - 1/r_base)
      Format: TSV
      fields:
      - element
      - axis_id
      - source_hub
      - sink_hub
      - fosmid
      - null
      - iter
      - delta_ieff
      - g_base
      - g_aug
      - n_added_rxns
      ext: tsv

# ---- significance (full-mixture SF vs the staged null; produced) ----
# `p` is the full-mixture survival function, left UNFLOORED so out-of-distribution
# cells get an estimate; `at_floor` flags rows resting on the fitted tail rather than
# on counted draws (extrapolation -- they carry no headline). `p_emp` is pure counting
# on the SAME raw pool, per row: the empirical null is a COLUMN, never a rival table.
# N_lo/N_hi/w are the interpolation bracket; there is no single matched size, so the
# retired `matched_N` column is gone and its presence marks a stale table.
  reff_significance:
    properties:
      _: effective-resistance significance vs the staged null (full-mixture SF p + per-row empirical p_emp, SF-interpolated across flanking size anchors, BH-q within element x style for schema parity only -- rank by effect size)
      Format: TSV
      fields:
      - fosmid
      - element
      - axis_id
      - n_orfs
      - N_lo
      - N_hi
      - w
      - null
      - delta_obs
      - p
      - p_emp
      - k_lo
      - k_hi
      - n_bg
      - p_floor
      - at_floor
      - q
      - survives
      ext: tsv
  ieff_significance:
    properties:
      _: effective-conductance significance vs the staged null (full-mixture SF p + per-row empirical p_emp, SF-interpolated across flanking size anchors, BH-q within element x style for schema parity only -- rank by effect size)
      Format: TSV
      fields:
      - fosmid
      - element
      - axis_id
      - n_orfs
      - N_lo
      - N_hi
      - w
      - null
      - delta_obs
      - p
      - p_emp
      - k_lo
      - k_hi
      - n_bg
      - p_floor
      - at_floor
      - q
      - survives
      ext: tsv

# ---- ablation (LOO + gene-solo, both metrics; produced) ----
  ablation_importance:
    properties:
      _: per-(fosmid, axis, orf) gene-ablation importance -- full/LOO/gene-solo for BOTH delta_reff and delta_ieff
      Format: TSV
      fields:
      - element
      - axis_id
      - source_hub
      - sink_hub
      - fosmid
      - orf
      - r_base
      - delta_reff_full
      - delta_reff_loo
      - importance
      - delta_ieff_full
      - delta_ieff_loo
      - importance_ieff
      - delta_reff_solo
      - delta_ieff_solo
      - n_rxn_orf
      ext: tsv

# ---- null-family STUDY tables (produced) ----
# Separate from the canonical significance type ON PURPOSE. `ecspr::{lane}_significance`
# has exactly ONE producer (the full-mixture SF) and no staged input can change what it
# means. Alternative families land here instead, clearly labelled, where no figure reads
# them by accident. The incumbent made the scorer a swappable flag; three figure
# generators then drifted onto three different null tables in two days and one shipped a
# title asserting the opposite of its own annotations. Promoting a family is a deliberate,
# re-gated edit to the canonical scorer -- never a parameter someone passes.
  reff_significance_study:
    properties:
      _: effective-resistance significance under an ALTERNATIVE null-scoring family (study only; not canonical -- see ecspr::reff_significance)
      Format: TSV
      fields:
      - fosmid
      - element
      - axis_id
      - n_orfs
      - N_lo
      - N_hi
      - w
      - null
      - delta_obs
      - family
      - p
      - n_bg
      - p_floor
      - at_floor
      - q
      ext: tsv
  ieff_significance_study:
    properties:
      _: effective-conductance significance under an ALTERNATIVE null-scoring family (study only; not canonical -- see ecspr::ieff_significance)
      Format: TSV
      fields:
      - fosmid
      - element
      - axis_id
      - n_orfs
      - N_lo
      - N_hi
      - w
      - null
      - delta_obs
      - family
      - p
      - n_bg
      - p_floor
      - at_floor
      - q
      ext: tsv

# ---------------------------------------------------------------------
# Folded in from the fabfos repo's own data_types/ (2026-07-19). These
# name the frozen reference universe and the provenance-tracked data
# library; no transform produces them. Names already present upstream
# were left alone -- transforms encode those definitions in their
# requirement hashes.
# ---------------------------------------------------------------------
  reference_manifest:
    properties:
      _: pre-bake MANIFEST.json -- pins, content hashes, verdict counts
      Format: JSON
      ext: json
  atom_pairs:
    properties:
      _: atom-atom mapping table, MNXR-keyed (substrate/product atom transits)
      Format: PARQUET
      ext: parquet
  closure_ledger:
    properties:
      _: per-reaction closure ledger (resolved / diluted / refused + reason)
      Format: PARQUET
      ext: parquet
  worklist:
    properties:
      _: pre-bake worklist of reactions pending resolution
      Format: TSV
      ext: tsv
  significance_table:
    properties:
      _: full-mixture-SF significance scorer output, one row per axis/clone cell
      Format: TSV
      ext: tsv
  validation_set:
    properties:
      _: frozen expected outputs for the dual-network validation; gates only
      content: directory with MANIFEST.tsv + netA/ netB/ lanes/ ground_truth/

# ---- the X/Y benchmark (versioned; a version is SELF-CONTAINED) ----
# Seven types over what is physically ONE directory tree per version. The split
# is not tidiness: metasmith stamps one type per item and matches endpoints by
# property SUBSET, so a single `benchmark` type over the whole tree would let a
# transform asking for the answer key join the inputs with equal validity. That
# is a wrong join, and it raises nothing. Each description below is therefore
# load-bearing -- it is what makes these seven distinct endpoints.
  benchmark_observations:
    properties:
      _: MEASURED perturbation outcomes (the observation set, X-side evidence); one row per observed gene-set/host/target with the reactions it adds or removes. Never an expectation and never scored output -- this is what was seen in a wet lab, before any ECSPr number exists
      content: directory of gof_/lof_ observation TSVs + drops/audit tables + README
  benchmark_decisions:
    properties:
      _: the hand-made curation decision tables (strain->lineage->GEM, and gene->reaction overrides with deciding evidence). Committed as DATA rather than buried as literals in a builder, so each judgement call is reviewable
      content: directory of host_lineage.tsv + gene_reaction_overrides.tsv
  benchmark_inputs:
    properties:
      _: the frozen X of the benchmark contract -- hosts/gpr/reactions/reaction_participants/metabolites/crosswalk/invariants. Carries the per-reaction evidence weight E for every build, which is exactly why the benchmark needs no annotation lane re-run. Ships NO atom mapping, deliberately
      content: directory of the seven X TSVs + _provenance.json
  benchmark_answer_key:
    properties:
      _: the frozen Y of the benchmark contract -- conditions/panel_anchors/panel_edges/expectations. Authored WITHOUT reading any ECSPr output, which is the property that makes a score a measurement rather than a tuning; frozen and hashed before any solve runs
      content: directory of conditions/panel_anchors/panel_edges/expectations TSVs + provenance JSON
  benchmark_ground_truth:
    properties:
      _: the upstream ground-truth tables the answer key is DERIVED FROM (phenotype/auxotrophy edges, LOF essentiality, curated GOF transplant sinks). Staged so a version can rebuild its own answer key from source rather than inheriting another version's conclusions
      content: directory of conditions_manifest + pheno_edges + lof_ground_truth + gof_*.tsv
  benchmark_baseline:
    properties:
      _: reference SCORES from a previously scored run, carried so a new result has something to be compared against. An output of scoring, never an input to it -- staging this where the answer key belongs would leak scored numbers into the key
      content: directory of specificity/potency/essentiality TSVs
  benchmark_base_graphs:
    properties:
      _: the element-resolved bipartite graphs the incumbent solves on, one per (facet, element). NOT derivable from X -- X withholds the atom mapping on purpose, and the atom-transit count is both the edge weight and, via the w<=0 edge drop, the connectivity. Network construction, never ECSPr output, which is what lets the answer-key builders read it without breaking independence
      content: directory of netA_*/netB_*/base_{C,N,S,P}.pkl networkx graphs
  benchmark_universe:
    properties:
      _: the atom-mapped MetaNetX universe per element, from which every base graph is induced. Needed at SOLVE time and not only at build time -- applying a gain-of-function perturbation re-reads it to find the inserted reactions, so a tree without it fails on the first GOF condition
      content: directory of mnx_bipartite_{C,N,S,P}.pkl
  benchmark_provenance:
    properties:
      _: a benchmark version's own self-description -- per-file sha256 manifest, audit gate results, and the prose recording what it is and what it deliberately does not contain
      content: directory of MANIFEST.tsv + _audit.json + README.md + PROVENANCE.md

# ---- the benchmark's SOLVED side (produced by ecsprBenchmark) ----
# These two are the first benchmark types that are ECSPr OUTPUT rather than
# frozen contract, and their descriptions carry more weight than most because of
# what they sit beside. `ecspr::benchmark_observations` is the WET-LAB
# observation set -- an input, authored before any solve -- and the two words
# overlap. Under property-SUBSET matching a slack description here would let a
# transform asking for the measured observations join the solver's output with
# equal validity: a wrong join that raises nothing and produces a benchmark that
# scores the solver against itself. Each `_` below therefore says explicitly
# what the item IS, what it is NOT, and which side of the freeze it falls on.
  benchmark_observations_solved:
    properties:
      _: SOLVER OUTPUT, one shard table per (facet, element) -- the signed conductance change g_perturbed - g_base on every panel edge, for every condition in the answer key. Emphatically NOT ecspr::benchmark_observations, which is the measured wet-lab evidence authored before any solve ran; this is what the incumbent PREDICTS for those conditions and exists only after a solve. Sharded, unsorted, and not yet scorable -- the scorer reads the merged ecspr::benchmark_result, never this
      content: directory of <facet>/<element>.tsv, cols facet/condition_id/edge_id/effect
  benchmark_result:
    properties:
      _: the single merged benchmark observation table -- every (facet, element) shard concatenated and sorted on (facet, condition_id, edge_id). THE scorable artifact of a benchmark run and the only one a scoring step should read; a per-shard table is a fragment of a measurement, not a measurement. Effects are signed differences, zero where a perturbation was silent (a zero is a result, never a missing value), and the scorer consumes ORDER only
      Format: TSV
      fields:
      - facet
      - condition_id
      - edge_id
      - effect
      ext: tsv
