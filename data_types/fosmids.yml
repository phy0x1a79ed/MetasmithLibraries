types:
# -----------------------------------------
# end-sequence / scaffolding lane (side lanes; types kept for the full domain)
  end_sequences_forward:
    properties:
      _: fosmid forward end-sequences (fasta records keyed by insert_id)
      Format: FASTA
      Data: fosmid end sequence
      direction: forward
      ext: fna
  end_sequences_reverse:
    properties:
      _: fosmid reverse end-sequences (fasta records keyed by insert_id)
      Format: FASTA
      Data: fosmid end sequence
      direction: reverse
      ext: fna
  end_sequences_table:
    properties:
      _: fosmid ends manifest (insert_ids + ends_facing flag)
      Format: JSON
      fields:
      - insert_ids
      - ends_facing
      ext: json
  vector_backbone:
    properties:
      _: fosmid vector backbone reference fasta
      Format: FASTA
      Data: vector backbone reference
      ext: fna
  scaffolds:
    properties:
      _: end-aware scaffolded fosmid inserts
      Format: FASTA
      Data: fosmid scaffold
      ext: fna
  scaffold_report:
    properties:
      _: fosmid scaffold mapping report
      Format: CSV
      fields:
      - id
      - mapping_quality
      - paired
      - resolved_length
      - assemblers
      - contig_id
      - original_id
      ext: csv
  pool_size_estimate:
    properties:
      _: fosmid pool size estimate
      Format: JSON
      fields:
      - size
      - size_with_singletons
      ext: json
# -----------------------------------------
# putative-insert recovery (cluster -> coverage -> chimera-split -> trim)
  recovery_experiment:
    properties:
      logistics: to group the pooled assemblies + reads of one fosmid-recovery run (single grouping node; all inputs and intermediates descend from it)
  clustered_contigs:
    properties:
      _: representative (deduped) contig set from all-vs-all clustering of the per-pool assemblies
      Format: FASTA
      Data: nucleic acid sequence
      content: clustered representative contigs
      ext: fna
  cluster_membership:
    properties:
      _: cluster membership of the clustered contigs (one row per input contig)
      Format: CSV
      fields:
      - cluster
      - centroid
      - member
      - assembler
      - source_pool
      - length
      ext: csv
  pool_coverage_profiles:
    properties:
      _: per-contig x per-pool per-bp read-depth arrays over the clustered contigs; keyed on the original clustered contig ids and never mutated downstream (split/trim slice it by header interval)
      Format: pickle (gzip)
      Data: per-bp depth arrays keyed by contig then pool
      ext: pkl.gz
  split_contigs:
    properties:
      _: contigs after chimera splitting; interval provenance baked into each FASTA header (source=<clustered_id> start= end= action=)
      Format: FASTA
      Data: nucleic acid sequence
      content: chimera-split contigs with header-baked provenance
      ext: fna
  putative_inserts:
    properties:
      _: final putative fosmid inserts after coverage trimming; same header-baked provenance convention (intervals updated by any trim), length-banded to the lambda window
      Format: FASTA
      Data: nucleic acid sequence
      content: putative fosmid inserts
      # `origin: assembler` marks this a superset of sequences::assembly so the
      # existing prodigal (and any assembly-generic transform) will call ORFs on
      # the final inserts unchanged -- metasmith matches on property superset,
      # cross-namespace `extends` is not available.
      origin: assembler
      ext: fna
  reference_inserts:
    properties:
      _: the canonical fosmid reference set -- putative inserts filtered to length >= min_insert_length (default 29 kb, the phage-packaging/lambda-window cutoff); the FASTA every downstream analysis (read-mapping, annotation, ECSPr) runs on
      Format: FASTA
      Data: nucleic acid sequence
      content: reference fosmid inserts (length-filtered)
      origin: assembler
      ext: fna
  insert_coverage:
    properties:
      _: read-mapping coverage summary of the pooled reads against the reference inserts; one row per (insert_id, pool) plus an "all"-pool aggregate, with depth/breadth stats
      Format: CSV
      fields:
      - insert_id
      - pool
      - length
      - mapped_bp
      - mean_depth
      - median_depth
      - breadth_1x
      - breadth_5x
      ext: csv
  putative_insert_report:
    properties:
      _: per-insert provenance + length-band report for the recovered putative fosmids
      Format: CSV
      fields:
      - insert_id
      - source
      - action
      - start
      - end
      - length
      - pool_basis
      - band
      ext: csv
