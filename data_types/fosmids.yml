types:
# -----------------------------------------
# end-sequence / scaffolding lane (side lanes; types kept for the full domain)
  end_sequences_forward:
    properties:
      _: fosmid forward end-sequences (fasta records keyed by insert_id)
      Format: FASTA
      Data: fosmid end sequence
      direction: forward
      ext: fna
  end_sequences_reverse:
    properties:
      _: fosmid reverse end-sequences (fasta records keyed by insert_id)
      Format: FASTA
      Data: fosmid end sequence
      direction: reverse
      ext: fna
  end_sequences_table:
    properties:
      _: fosmid ends manifest (insert_ids + ends_facing flag)
      Format: JSON
      fields:
      - insert_ids
      - ends_facing
      ext: json
  vector_backbone:
    properties:
      _: fosmid vector backbone reference fasta
      Format: FASTA
      Data: vector backbone reference
      ext: fna
  scaffolds:
    properties:
      _: end-aware scaffolded fosmid inserts
      Format: FASTA
      Data: fosmid scaffold
      ext: fna
  scaffold_report:
    properties:
      _: fosmid scaffold mapping report
      Format: CSV
      fields:
      - id
      - mapping_quality
      - paired
      - resolved_length
      - assemblers
      - contig_id
      - original_id
      ext: csv
  pool_size_estimate:
    properties:
      _: fosmid pool size estimate
      Format: JSON
      fields:
      - size
      - size_with_singletons
      ext: json
# -----------------------------------------
# putative-insert recovery (junction split -> cross-assembler dedup)
  recovery_experiment:
    properties:
      logistics: to group the pooled assemblies + reads of one fosmid-recovery run (single grouping node; all inputs and intermediates descend from it)
  junction_map:
    properties:
      _: pCC1 backbone alignments against one pool's assembler contigs, one row per hit, carrying the junction positions the split acts on. Co-produced with `split_contigs` by `junction_split` -- the evidence record for a cut that happens in the same job, not a staging boundary. `junction_kind` separates a terminal hit (vector at a contig end -- a real insert boundary) from an internal one (vector mid-contig -- two clones the assembler joined through their shared backbone).
      Format: CSV
      fields:
      - contig_id
      - assembler
      - source_pool
      - hit_start
      - hit_end
      - strand
      - pident
      - aln_length
      - junction_pos
      - junction_kind
      ext: csv
  split_contigs:
    properties:
      _: one pool's contigs after splitting at the vector-backbone junctions; interval provenance baked into each FASTA header (source=<contig_id> start= end= action=)
      Format: FASTA
      Data: nucleic acid sequence
      content: junction-split contigs with header-baked provenance
      ext: fna
  cluster_membership:
    properties:
      _: cluster membership of the deduped insert set (one row per input split contig)
      Format: CSV
      fields:
      - cluster
      - centroid
      - member
      - assembler
      - source_pool
      - length
      ext: csv
  putative_inserts:
    properties:
      _: final putative fosmid inserts -- the cross-assembler dedup of the junction-split contigs; same header-baked provenance convention, length-banded to the lambda window
      Format: FASTA
      Data: nucleic acid sequence
      content: putative fosmid inserts
      # `origin: assembler` marks this a superset of sequences::assembly so the
      # existing prodigal (and any assembly-generic transform) will call ORFs on
      # the final inserts unchanged -- metasmith matches on property superset,
      # cross-namespace `extends` is not available.
      origin: assembler
      ext: fna
  reference_inserts:
    properties:
      _: the canonical fosmid reference set -- putative inserts filtered to length >= min_insert_length (default 29 kb, the phage-packaging/lambda-window cutoff); the FASTA every downstream analysis (read-mapping, annotation, ECSPr) runs on
      Format: FASTA
      Data: nucleic acid sequence
      content: reference fosmid inserts (length-filtered)
      origin: assembler
      ext: fna
  insert_coverage:
    properties:
      _: read-mapping coverage summary of the pooled reads against the reference inserts; one row per (insert_id, pool) plus an "all"-pool aggregate, with depth/breadth stats
      Format: CSV
      fields:
      - insert_id
      - pool
      - length
      - mapped_bp
      - mean_depth
      - median_depth
      - breadth_1x
      - breadth_5x
      ext: csv
  putative_insert_report:
    properties:
      _: per-insert provenance + length-band report for the recovered putative fosmids
      Format: CSV
      fields:
      - insert_id
      - source
      - action
      - start
      - end
      - length
      # was `pool_basis`, which came from the retired per-experiment coverage
      # matrix; the pool is now carried through cluster_membership instead.
      - source_pool
      - band
      ext: csv
