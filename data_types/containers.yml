  # -------------------------------------------------
  # functional annotation
  antismash.oci:
    extends: container
    properties:
      provides:
        - antismash
  busco.oci:
    extends: container
    properties:
      provides:
      - busco
  bakta.oci:
    extends: container
    properties:
      provides:
      - bakta
  deeptfactor.oci:
    extends: container
    properties:
      provides:
      - deeptfactor
  predictf.oci:
    extends: container
    properties:
      provides:
      - predictf
  clean.oci:
    extends: container
    properties:
      provides:
      - clean

  # -------------------------------------------------
  # transcriptomics
  braker3.oci:
    extends: container
    properties:
      provides:
      - braker3
  star.oci:
    extends: container
    properties:
      provides:
      - STAR
  salmon.oci:
    extends: container
    properties:
      provides:
      - salmon
  stringtie.oci:
    extends: container
    properties:
