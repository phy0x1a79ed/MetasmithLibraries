types:
  metagenome_sample:
    properties:
      _: a metagenome sample identifier for binning

  contig_to_bin_table:
    properties:
      _: contig to bin assignment table
      ext: tsv

  metabat2_contig_to_bin_table:
    extends:
    - contig_to_bin_table
    properties:
      method: metabat2

  semibin2_contig_to_bin_table:
    extends:
    - contig_to_bin_table
    properties:
      method: semibin2

  comebin_contig_to_bin_table:
    extends:
    - contig_to_bin_table
    properties:
      method: comebin
